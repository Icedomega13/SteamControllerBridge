name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore .\SteamControllerBridge.sln

      - name: Build
        run: dotnet build .\SteamControllerBridge.sln -c Release --no-restore

      - name: Publish app
        run: dotnet publish .\SteamControllerBridge\SteamControllerBridge.csproj -c Release -r win-x64 --self-contained false -o .\artifacts\SteamControllerBridge-win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamControllerBridge-win-x64
          path: .\artifacts\SteamControllerBridge-win-x64\
